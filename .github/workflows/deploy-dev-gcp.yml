name: Deploy to Development (GCP)

on:
  push:
    branches:
      - dev

# SECURITY: Explicitly limit GITHUB_TOKEN permissions (principle of least privilege)
# This workflow only needs to read repository contents for checkout
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GCP Development Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Build on the fast GitHub Actions runner instead of the small GCP VM.
      # The runner has more CPU/RAM; vite build with 779+ modules was consistently
      # timing out on the server (7+ minutes).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy backend & prepare dist directory
        uses: appleboy/ssh-action@v1.2.5
        env:
          UPC_API_KEY: ${{ secrets.UPC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          envs: UPC_API_KEY,PEXELS_API_KEY,RESEND_API_KEY,EMAIL_FROM_ADDRESS,EMAIL_FROM_NAME,CRON_SECRET
          # timeout: SSH dial+handshake timeout. Fail fast if the server is
          # unresponsive instead of hanging for 29+ minutes (which previously
          # triggered fail2ban bans from repeated retry attempts).
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e

            echo "======================================"
            echo "Starting GCP Development Deployment"
            echo "======================================"

            cd /home/michaelt452/freezer-inventory-dev

            # Create .env file with API keys and email config
            echo "Creating .env file..."
            cat > backend/.env << EOF
            UPC_API_KEY=${UPC_API_KEY}
            PEXELS_API_KEY=${PEXELS_API_KEY}
            RESEND_API_KEY=${RESEND_API_KEY}
            EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
            EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Freezer Inventory}
            CRON_SECRET=${CRON_SECRET}
            EOF
            echo "✓ Environment variables configured"

            # Create backup before deployment
            echo "Creating backup..."
            mkdir -p backups
            if [ -f backend/instance/freezer_inventory.db ]; then
              cp backend/instance/freezer_inventory.db backups/freezer_inventory_$(date +%Y%m%d_%H%M%S).db
              echo "✓ Backup created"
            fi

            # Pull latest code from dev branch
            echo "Pulling latest code from dev..."
            git fetch origin
            git reset --hard origin/dev
            echo "✓ Code updated"

            # Stop services before updating dependencies
            # Use timeout so a hung service can never block the deployment indefinitely.
            # If graceful stop takes >30s, force-kill via systemctl kill.
            echo "Stopping services..."
            sudo timeout 30 systemctl stop freezer-backend-dev 2>/dev/null || sudo systemctl kill freezer-backend-dev 2>/dev/null || true
            sudo timeout 30 systemctl stop freezer-frontend-dev 2>/dev/null || sudo systemctl kill freezer-frontend-dev 2>/dev/null || true
            # Remove stale gunicorn control socket so the new process can create it cleanly
            sudo rm -f backend/gunicorn.ctl 2>/dev/null || true
            # Remove SQLite WAL/SHM lock files left by a killed gunicorn worker.
            # If a worker held a write lock when it was SIGKILL'd these files survive
            # and cause the next worker's db.create_all() to block indefinitely.
            sudo rm -f backend/instance/*.db-wal backend/instance/*.db-shm 2>/dev/null || true
            echo "✓ Services stopped"

            # Update backend dependencies
            echo "Updating backend dependencies..."
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            cd ..
            echo "✓ Backend dependencies updated"

            # Update frontend dependencies
            echo "Updating frontend dependencies..."
            cd frontend
            npm install --silent
            # Purge vite's cache dirs. They may be owned by a different user from a
            # previous run; the service user must be able to delete/recreate them.
            # Remove vite cache dirs if gh-deploy owns them (plain rm works for our
            # files; sudo rm is not allowed for arbitrary paths). If michaelt452 owns
            # them from a previous service run they survive — that's fine, it can write
            # to its own dirs already.
            rm -rf node_modules/.vite node_modules/.vite-temp 2>/dev/null || true
            # Re-create with 777 so the service user can write inside when gh-deploy
            # created them fresh. If dirs still exist (owned by michaelt452), chmod
            # fails silently via || true — michaelt452 has full access as owner anyway.
            mkdir -p node_modules/.vite node_modules/.vite-temp
            chmod 777 node_modules/.vite node_modules/.vite-temp 2>/dev/null || true
            # Remove manifest.json if owned by gh-deploy; michaelt452 must write it
            # fresh via generate-version.js on startup. chmod o+w public lets it create
            # new files there but won't let it overwrite an existing gh-deploy-owned file.
            rm -f public/manifest.json 2>/dev/null || true
            chmod o+w public
            cd ..
            echo "✓ Frontend dependencies updated"

            # Run database migrations
            echo "Running database migrations..."
            cd backend
            source venv/bin/activate
            python3 run_feedback_migration.py || echo "⚠️  Migration already applied or not needed"
            python3 migrations/run_email_migration.py || echo "⚠️  Email migration already applied or not needed"
            python3 migrations/run_email_verification_migration.py || echo "⚠️  Email verification migration already applied or not needed"
            python3 migrations/run_low_stock_alerts_migration.py || echo "⚠️  Low-stock migration already applied or not needed"
            python3 migrations/run_passkey_migration.py || echo "⚠️  Passkey migration already applied or not needed"
            python3 migrations/run_expiration_notifications_migration.py || echo "⚠️  Expiration notifications migration already applied or not needed"
            sudo rm -f instance/*.db-journal instance/*.db-wal instance/*.db-shm 2>/dev/null || true
            cd ..
            echo "✓ Database migrations complete"

            echo "Clearing old frontend dist..."
            rm -rf frontend/dist 2>/dev/null || true
            mkdir -p frontend/dist
            echo "✓ Ready for dist upload"

            # Delete boot_id file to invalidate all sessions on deployment
            echo "Invalidating existing sessions..."
            rm -f backend/instance/.boot_id
            # Pre-create boot_id file to avoid race condition with multiple workers
            python3 -c "import uuid; open('backend/instance/.boot_id', 'w').write(str(uuid.uuid4()))"
            echo "✓ Sessions will be invalidated on restart"

      - name: Upload frontend dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "frontend/dist"
          target: "/home/michaelt452/freezer-inventory-dev/frontend"
          strip_components: 1
          overwrite: true

      - name: Restart services & health check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e

            echo "Restarting services..."
            # Remove stale SQLite WAL/SHM files one final time right before restart.
            # Migrations may have left WAL files; if the gunicorn worker starts while
            # a WAL file is present it can block indefinitely in db.create_all().
            sudo rm -f /home/michaelt452/freezer-inventory-dev/backend/instance/*.db-wal \
                       /home/michaelt452/freezer-inventory-dev/backend/instance/*.db-shm 2>/dev/null || true
            sudo systemctl restart freezer-backend-dev
            sudo systemctl restart freezer-frontend-dev
            echo "✓ Services restarted"

            # Backend health check (retry up to 120 seconds)
            echo "Running health check..."
            for i in {1..24}; do
              if curl -f --max-time 5 http://localhost:5002/api/health > /dev/null 2>&1; then
                echo "✓ Backend health check passed"
                break
              fi
              if [ $i -eq 24 ]; then
                echo "✗ Backend health check failed after 120s!"
                sudo systemctl status freezer-backend-dev --no-pager || true
                echo "--- Recent logs ---"
                journalctl -u freezer-backend-dev -n 50 --no-pager 2>/dev/null || sudo journalctl -u freezer-backend-dev -n 50 --no-pager 2>/dev/null || true
                exit 1
              fi
              echo "  Waiting for backend... (attempt $i/24)"
              sleep 5
            done

            # Frontend health check (retry up to 60 seconds)
            for i in {1..12}; do
              if curl -f --max-time 5 http://localhost:3001 > /dev/null 2>&1; then
                echo "✓ Frontend health check passed"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "✗ Frontend health check failed after 60s!"
                sudo systemctl status freezer-frontend-dev --no-pager || true
                echo "--- Service file ---"
                cat /etc/systemd/system/freezer-frontend-dev.service 2>/dev/null || true
                echo "--- Recent logs ---"
                journalctl -u freezer-frontend-dev -n 50 --no-pager 2>/dev/null || sudo journalctl -u freezer-frontend-dev -n 50 --no-pager 2>/dev/null || true
                echo "--- Vite dry-run (8s timeout) ---"
                cd /home/michaelt452/freezer-inventory-dev/frontend && timeout 8 node_modules/.bin/vite --port 3002 --host 0.0.0.0 2>&1 | head -40 || true
                exit 1
              fi
              echo "  Waiting for frontend... (attempt $i/12)"
              sleep 5
            done

            # Keep only last 10 backups
            cd /home/michaelt452/freezer-inventory-dev/backups
            ls -t freezer_inventory_*.db 2>/dev/null | tail -n +11 | xargs -r rm
            cd ..

            echo "======================================"
            echo "✓ GCP Development Deployment Complete!"
            echo "======================================"

      - name: Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          timeout: 30s
          script: |
            echo "======================================"
            echo "✗ GCP Development Deployment Failed!"
            echo "======================================"
            echo "Rolling back to last backup..."
            cd /home/michaelt452/freezer-inventory-dev
            LATEST_BACKUP=$(ls -t backups/freezer_inventory_*.db 2>/dev/null | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              cp "$LATEST_BACKUP" backend/instance/freezer_inventory.db
              sudo systemctl restart freezer-backend-dev
              echo "✓ Rolled back to: $LATEST_BACKUP"
            fi
