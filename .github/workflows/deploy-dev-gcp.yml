name: Deploy to Development (GCP)

on:
  push:
    branches:
      - dev

# SECURITY: Explicitly limit GITHUB_TOKEN permissions (principle of least privilege)
# This workflow only needs to read repository contents for checkout
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GCP Development Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Build on the fast GitHub Actions runner instead of the small GCP VM.
      # The runner has more CPU/RAM; vite build with 779+ modules was consistently
      # timing out on the server (7+ minutes).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy backend & prepare dist directory
        uses: appleboy/ssh-action@v1.2.5
        env:
          UPC_API_KEY: ${{ secrets.UPC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          envs: UPC_API_KEY,PEXELS_API_KEY,RESEND_API_KEY,EMAIL_FROM_ADDRESS,EMAIL_FROM_NAME
          # timeout: SSH dial+handshake timeout. Fail fast if the server is
          # unresponsive instead of hanging for 29+ minutes (which previously
          # triggered fail2ban bans from repeated retry attempts).
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e

            echo "======================================"
            echo "Starting GCP Development Deployment"
            echo "======================================"

            cd /home/michaelt452/freezer-inventory-dev

            # Create .env file with API keys and email config
            echo "Creating .env file..."
            cat > backend/.env << EOF
            UPC_API_KEY=${UPC_API_KEY}
            PEXELS_API_KEY=${PEXELS_API_KEY}
            RESEND_API_KEY=${RESEND_API_KEY}
            EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
            EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Freezer Inventory}
            EOF
            echo "✓ Environment variables configured"

            # Create backup before deployment
            echo "Creating backup..."
            mkdir -p backups
            if [ -f backend/instance/freezer_inventory.db ]; then
              cp backend/instance/freezer_inventory.db backups/freezer_inventory_$(date +%Y%m%d_%H%M%S).db
              echo "✓ Backup created"
            fi

            # Pull latest code from dev branch
            echo "Pulling latest code from dev..."
            git fetch origin
            git reset --hard origin/dev
            echo "✓ Code updated"

            # Stop services before updating dependencies
            # Use timeout so a hung service can never block the deployment indefinitely.
            # If graceful stop takes >30s, force-kill via systemctl kill.
            echo "Stopping services..."
            sudo timeout 30 systemctl stop freezer-backend-dev 2>/dev/null || sudo systemctl kill freezer-backend-dev 2>/dev/null || true
            sudo timeout 30 systemctl stop freezer-frontend-dev 2>/dev/null || sudo systemctl kill freezer-frontend-dev 2>/dev/null || true
            echo "✓ Services stopped"

            # Update backend dependencies
            echo "Updating backend dependencies..."
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            cd ..
            echo "✓ Backend dependencies updated"

            # Update frontend dependencies
            echo "Updating frontend dependencies..."
            cd frontend
            npm install --silent
            cd ..
            echo "✓ Frontend dependencies updated"

            # Run database migrations
            echo "Running database migrations..."
            cd backend
            source venv/bin/activate
            python3 run_feedback_migration.py || echo "⚠️  Migration already applied or not needed"
            python3 migrations/run_email_migration.py || echo "⚠️  Email migration already applied or not needed"
            python3 migrations/run_email_verification_migration.py || echo "⚠️  Email verification migration already applied or not needed"
            cd ..
            echo "✓ Database migrations complete"

            # Clear stale dist so the SCP upload replaces it cleanly.
            # Fix ownership of any root-owned files from prior deployments, then
            # remove the directory. Both are best-effort; if they fail (e.g. no
            # passwordless sudo configured yet), SCP will still overwrite same-named
            # files and new hashed filenames will be added alongside old ones.
            # Run `sudo chown -R michaelt452:michaelt452 frontend/dist` on the server
            # once to permanently resolve ownership and enable clean removal each deploy.
            echo "Clearing old frontend dist..."
            sudo chown -R "$(whoami)":"$(whoami)" frontend/dist 2>/dev/null || true
            rm -rf frontend/dist 2>/dev/null || true
            mkdir -p frontend/dist
            echo "✓ Ready for dist upload"

            # Delete boot_id file to invalidate all sessions on deployment
            echo "Invalidating existing sessions..."
            rm -f backend/instance/.boot_id
            # Pre-create boot_id file to avoid race condition with multiple workers
            python3 -c "import uuid; open('backend/instance/.boot_id', 'w').write(str(uuid.uuid4()))"
            echo "✓ Sessions will be invalidated on restart"

      - name: Upload frontend dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "frontend/dist"
          target: "/home/michaelt452/freezer-inventory-dev/frontend"
          strip_components: 1
          overwrite: true

      - name: Restart services & health check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e

            echo "Restarting services..."
            sudo systemctl restart freezer-backend-dev
            sudo systemctl restart freezer-frontend-dev
            echo "✓ Services restarted"

            # Backend health check (retry up to 30 seconds)
            echo "Running health check..."
            for i in {1..6}; do
              if curl -f --max-time 5 http://localhost:5002/api/health > /dev/null 2>&1; then
                echo "✓ Backend health check passed"
                break
              fi
              if [ $i -eq 6 ]; then
                echo "✗ Backend health check failed after 30s!"
                sudo systemctl status freezer-backend-dev --no-pager
                echo "--- Recent logs ---"
                sudo journalctl -u freezer-backend-dev -n 50 --no-pager
                exit 1
              fi
              echo "  Waiting for backend... (attempt $i/6)"
              sleep 5
            done

            # Frontend health check (retry up to 30 seconds)
            for i in {1..6}; do
              if curl -f --max-time 5 http://localhost:3001 > /dev/null 2>&1; then
                echo "✓ Frontend health check passed"
                break
              fi
              if [ $i -eq 6 ]; then
                echo "✗ Frontend health check failed after 30s!"
                sudo systemctl status freezer-frontend-dev --no-pager
                echo "--- Recent logs ---"
                sudo journalctl -u freezer-frontend-dev -n 50 --no-pager
                exit 1
              fi
              echo "  Waiting for frontend... (attempt $i/6)"
              sleep 5
            done

            # Keep only last 10 backups
            cd /home/michaelt452/freezer-inventory-dev/backups
            ls -t freezer_inventory_*.db 2>/dev/null | tail -n +11 | xargs -r rm
            cd ..

            echo "======================================"
            echo "✓ GCP Development Deployment Complete!"
            echo "======================================"

      - name: Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          timeout: 30s
          script: |
            echo "======================================"
            echo "✗ GCP Development Deployment Failed!"
            echo "======================================"
            echo "Rolling back to last backup..."
            cd /home/michaelt452/freezer-inventory-dev
            LATEST_BACKUP=$(ls -t backups/freezer_inventory_*.db 2>/dev/null | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              cp "$LATEST_BACKUP" backend/instance/freezer_inventory.db
              sudo systemctl restart freezer-backend-dev
              echo "✓ Rolled back to: $LATEST_BACKUP"
            fi
