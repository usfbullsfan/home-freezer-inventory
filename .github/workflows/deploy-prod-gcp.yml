name: Deploy to Production (GCP)

on:
  push:
    branches:
      - main

# SECURITY: Explicitly limit GITHUB_TOKEN permissions (principle of least privilege)
# This workflow only needs to read repository contents for checkout
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GCP Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Build on the fast GitHub Actions runner instead of the small GCP VM.
      # The runner has more CPU/RAM; vite build with 779+ modules was consistently
      # timing out on the server (7+ minutes).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy backend & prepare dist directory
        uses: appleboy/ssh-action@v1.2.5
        env:
          UPC_API_KEY: ${{ secrets.UPC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        with:
          host: ${{ secrets.GCP_PROD_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          envs: UPC_API_KEY,PEXELS_API_KEY,RESEND_API_KEY,EMAIL_FROM_ADDRESS,EMAIL_FROM_NAME,CRON_SECRET
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e

            echo "======================================"
            echo "Starting GCP Production Deployment"
            echo "======================================"

            cd /home/michaelt452/freezer-inventory

            # Create .env file with API keys and email config
            echo "Creating .env file..."
            cat > backend/.env << EOF
            UPC_API_KEY=${UPC_API_KEY}
            PEXELS_API_KEY=${PEXELS_API_KEY}
            RESEND_API_KEY=${RESEND_API_KEY}
            EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
            EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Freezer Inventory}
            CRON_SECRET=${CRON_SECRET}
            EOF
            echo "✓ Environment variables configured"

            # Create backup before deployment
            echo "Creating backup..."
            mkdir -p backups
            if [ -f backend/instance/freezer_inventory.db ]; then
              cp backend/instance/freezer_inventory.db backups/freezer_inventory_$(date +%Y%m%d_%H%M%S).db
              echo "✓ Backup created"
            fi

            # Pull latest code
            echo "Pulling latest code from main..."
            git fetch origin
            git reset --hard origin/main
            # gunicorn 22+ creates a gunicorn.ctl control socket in backend/.
            # backend/ is owned by gh-deploy after git reset, so the service user
            # can't create it. chmod o+w follows the same pattern used for instance/
            # and node_modules throughout this script.
            chmod o+w backend
            echo "✓ Code updated"

            # Stop services before updating dependencies
            # Use timeout so a hung service can never block the deployment indefinitely.
            # If graceful stop takes >30s, force-kill via systemctl kill.
            echo "Stopping services..."
            sudo timeout 30 systemctl stop freezer-backend 2>/dev/null || sudo systemctl kill freezer-backend 2>/dev/null || true
            sudo timeout 30 systemctl stop freezer-frontend 2>/dev/null || sudo systemctl kill freezer-frontend 2>/dev/null || true
            # Remove stale gunicorn control socket so the new process can create it cleanly
            sudo rm -f backend/gunicorn.ctl 2>/dev/null || true
            # Remove SQLite WAL/SHM lock files left by a killed gunicorn worker.
            # If a worker held a write lock when it was SIGKILL'd these files survive
            # and cause the next worker's db.create_all() to block indefinitely.
            rm -f backend/instance/*.db-wal backend/instance/*.db-shm 2>/dev/null || \
              sudo rm -f backend/instance/*.db-wal backend/instance/*.db-shm 2>/dev/null || true
            echo "✓ Services stopped"

            # Update backend dependencies
            echo "Updating backend dependencies..."
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            cd ..
            echo "✓ Backend dependencies updated"

            # Update frontend dependencies
            echo "Updating frontend dependencies..."
            cd frontend
            npm install --omit=dev
            # Create vite cache dirs with open permissions so the service user
            # (michaelt452) can write its own cache inside them on startup.
            mkdir -p node_modules/.vite node_modules/.vite-temp
            chmod 777 node_modules/.vite node_modules/.vite-temp
            # Remove manifest.json so generate-version.js (running as michaelt452)
            # can recreate it; chmod o+w lets it write new files into public/.
            rm -f public/manifest.json 2>/dev/null || true
            chmod o+w public
            cd ..
            echo "✓ Frontend dependencies updated"

            # Run database migrations
            echo "Running database migrations..."
            cd backend
            source venv/bin/activate
            python3 run_feedback_migration.py || echo "⚠️  Migration already applied or not needed"
            python3 migrations/run_email_migration.py || echo "⚠️  Email migration already applied or not needed"
            python3 migrations/run_email_verification_migration.py || echo "⚠️  Email verification migration already applied or not needed"
            python3 migrations/run_low_stock_alerts_migration.py || echo "⚠️  Low-stock migration already applied or not needed"
            python3 migrations/run_passkey_migration.py || echo "⚠️  Passkey migration already applied or not needed"
            python3 migrations/run_expiration_notifications_migration.py || echo "⚠️  Expiration notifications migration already applied or not needed"
            # Fix ownership: migrations run as gh-deploy but gunicorn runs as michaelt452.
            # Any SQLite journal/WAL files created during migration must be owned by the
            # service user, otherwise gunicorn gets "attempt to write a readonly database".
            sudo chown michaelt452:michaelt452 instance/*.db 2>/dev/null || true
            sudo rm -f instance/*.db-journal instance/*.db-wal instance/*.db-shm 2>/dev/null || true
            # Ensure the instance directory is writable by michaelt452 (the service user).
            # SQLite must create journal/lock files in the same directory as the DB.
            sudo chmod o+w instance/ 2>/dev/null || true
            cd ..
            echo "✓ Database migrations complete"

            # Clear stale dist so the SCP upload replaces it cleanly.
            # Fix ownership of any root-owned files from prior deployments, then
            # remove the directory. Both are best-effort; if they fail (e.g. no
            # passwordless sudo configured yet), SCP will still overwrite same-named
            # files and new hashed filenames will be added alongside old ones.
            # Run `sudo chown -R michaelt452:michaelt452 frontend/dist` on the server
            # once to permanently resolve ownership and enable clean removal each deploy.
            echo "Clearing old frontend dist..."
            sudo chown -R "$(whoami)":"$(whoami)" frontend/dist 2>/dev/null || true
            sudo chown -R "$(whoami)":"$(whoami)" frontend/public 2>/dev/null || true
            # Make public writable by any service user so generate-version.js can write version.json
            chmod -R a+w frontend/public 2>/dev/null || true
            rm -rf frontend/dist 2>/dev/null || true
            mkdir -p frontend/dist
            echo "✓ Ready for dist upload"

            # Delete boot_id file to invalidate all sessions on deployment
            echo "Invalidating existing sessions..."
            rm -f backend/instance/.boot_id
            # Pre-create boot_id file to avoid race condition with multiple workers
            python3 -c "import uuid; open('backend/instance/.boot_id', 'w').write(str(uuid.uuid4()))"
            echo "✓ Sessions will be invalidated on restart"

      - name: Upload frontend dist to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.GCP_PROD_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "frontend/dist"
          target: "/home/michaelt452/freezer-inventory/frontend"
          strip_components: 1
          overwrite: true

      - name: Restart services & health check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_PROD_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e

            echo "Restarting services..."
            # Remove stale SQLite WAL/SHM files one final time right before restart.
            # Migrations may have left WAL files; if the gunicorn worker starts while
            # a WAL file is present it can block indefinitely in db.create_all().
            sudo rm -f /home/michaelt452/freezer-inventory/backend/instance/*.db-wal \
                       /home/michaelt452/freezer-inventory/backend/instance/*.db-shm 2>/dev/null || true
            sudo systemctl restart freezer-backend
            sudo systemctl restart freezer-frontend
            echo "✓ Services restarted"

            # Backend health check (retry up to 120 seconds)
            echo "Running health check..."
            for i in {1..24}; do
              if curl -f --max-time 5 http://localhost:5001/api/health > /dev/null 2>&1; then
                echo "✓ Backend health check passed"
                break
              fi
              if [ $i -eq 24 ]; then
                echo "✗ Backend health check failed after 120s!"
                sudo systemctl status freezer-backend --no-pager || true
                echo "--- Recent logs ---"
                journalctl -u freezer-backend -n 50 --no-pager 2>/dev/null || sudo journalctl -u freezer-backend -n 50 --no-pager 2>/dev/null || true
                exit 1
              fi
              echo "  Waiting for backend... (attempt $i/24)"
              sleep 5
            done

            # Frontend health check (retry up to 60 seconds)
            for i in {1..12}; do
              if curl -f --max-time 5 http://localhost:3000 > /dev/null 2>&1; then
                echo "✓ Frontend health check passed"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "✗ Frontend health check failed after 60s!"
                sudo systemctl status freezer-frontend --no-pager || true
                echo "--- Recent logs ---"
                journalctl -u freezer-frontend -n 50 --no-pager 2>/dev/null || sudo journalctl -u freezer-frontend -n 50 --no-pager 2>/dev/null || true
                exit 1
              fi
              echo "  Waiting for frontend... (attempt $i/12)"
              sleep 5
            done

            # Keep only last 10 backups
            cd /home/michaelt452/freezer-inventory/backups
            ls -t freezer_inventory_*.db 2>/dev/null | tail -n +11 | xargs -r rm
            cd ..

            echo "======================================"
            echo "✓ GCP Production Deployment Complete!"
            echo "======================================"

      - name: Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_PROD_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          timeout: 30s
          script: |
            echo "======================================"
            echo "✗ GCP Production Deployment Failed!"
            echo "======================================"
            echo "Rolling back to last backup..."
            cd /home/michaelt452/freezer-inventory
            LATEST_BACKUP=$(ls -t backups/freezer_inventory_*.db 2>/dev/null | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              cp "$LATEST_BACKUP" backend/instance/freezer_inventory.db
              sudo systemctl restart freezer-backend
              echo "✓ Rolled back to: $LATEST_BACKUP"
            fi
