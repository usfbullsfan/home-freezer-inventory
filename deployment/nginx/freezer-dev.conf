# Freezer Inventory (dev) - static frontend + /api proxy.
#
# Install as /etc/nginx/snippets/freezer-dev.conf and include it inside the
# existing 443 server block of the freezer-wetpaws-dev site, replacing the
# old "location / { proxy_pass http://...:3001; }" block:
#
#     include snippets/freezer-dev.conf;
#
# Keep the server_name, listen and ssl_* lines that are already in the site.
# See docs/deployment/gcp-memory.md for the full procedure.

root /home/michaelt452/freezer-inventory-dev/frontend/dist;
index index.html;

# Uploaded images are up to 5 MB (MAX_CONTENT_LENGTH in backend/app.py);
# nginx's default limit is 1 MB.
client_max_body_size 6m;

gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Backend API -> gunicorn
location /api/ {
    proxy_pass http://127.0.0.1:5002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Vite's hashed bundles never change, so browsers may cache them for good.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Must always be fresh: the app checks version.json for updates, and
# manifest.json differs between prod and dev.
location = /version.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
location = /manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Never serve dotfiles (except /.well-known for certificate checks).
location ~ /\.(?!well-known) {
    deny all;
}

# SPA fallback: unknown paths (e.g. /item/<code> from a QR label) get
# index.html, and React Router takes it from there. index.html itself is
# never cached, so a deploy is picked up on the next page load.
location / {
    try_files $uri $uri/ /index.html;
}
location = /index.html {
    add_header Cache-Control "no-cache";
}
